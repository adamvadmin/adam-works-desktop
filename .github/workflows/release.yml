# 태그(v*)를 올리면 Windows 설치 파일을 빌드해 GitHub Releases에 올린다.
# 설치된 프로그램은 electron-updater로 이 Releases를 확인해 자동 업데이트한다.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # 액션은 태그가 아닌 커밋으로 고정 (태그가 바뀌어도 같은 코드)
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 태그와 package.json 버전 일치 확인
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME} 와 package.json 버전 v$VERSION 이 다릅니다." >&2
            exit 1
          fi
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
