# 태그(v*)를 올리면 Windows 설치 파일을 빌드해 GitHub Releases에 올린다.
# 설치된 프로그램은 electron-updater로 이 Releases를 확인해 자동 업데이트한다.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # 액션은 태그가 아닌 커밋으로 고정 (태그가 바뀌어도 같은 코드)
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 태그와 package.json 버전 일치 확인
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME} 와 package.json 버전 v$VERSION 이 다릅니다." >&2
            exit 1
          fi
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 불변 릴리스: 공개 후에는 파일을 올릴 수 없어 초안에 다 올린 뒤 공개한다 (공개 순간 잠긴다)
      - name: 초안 릴리스 공개
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API?per_page=20" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).find(x=>x.tag_name===process.env.GITHUB_REF_NAME&&x.draft);if(!r){process.exit(1)}console.log(r.id)})")
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API/$ID/assets" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).map(a=>a.name).join(' ')))")
          echo "assets: $ASSETS"
          for f in latest.yml ".exe" ".blockmap"; do
            echo "$ASSETS" | grep -q -- "$f" || { echo "missing asset: $f" >&2; exit 1; }
          done
          curl -fsS -X PATCH -H "Authorization: Bearer $GH_TOKEN" "$API/$ID" -d '{"draft":false,"make_latest":"true"}' > /dev/null
          echo "published release $ID"
