appId: kr.adamv.works.messenger
productName: V WORKS 메신저
copyright: Copyright © Adamv
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/icons/**/*
  - pages/**/*
  - package.json
# Electron 보안 스위치: Node로 실행·NODE_OPTIONS·디버그 인자 차단, app.asar 무결성 검사·asar에서만 로드, 쿠키 암호화
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # 앱 안 로컬 화면(시작·설정·연결 대기)을 file:// 로 띄우므로 켜 둔다 (끄면 이 화면들이 열리지 않는다)
  grantFileProtocolExtraPrivileges: true
win:
  target:
    - nsis
  icon: build/icons/icon.png
  artifactName: VWORKS-Messenger-Setup-${version}.${ext}
# 설치 마법사: 시작(그림·안내) → 설치 → 마침(바로 실행). 설치 범위는 build/installer.nsh에서 현재 사용자로 고정
# 자동 업데이트는 같은 설치 파일을 조용히(/S) 실행하므로 화면이 뜨지 않는다
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  installerLanguages:
    - ko_KR
  language: "1042"
  installerSidebar: build/installer/sidebar.bmp
  uninstallerSidebar: build/installer/sidebar.bmp
  installerHeader: build/installer/header.bmp
  uninstallDisplayName: V WORKS 메신저
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: V WORKS 메신저
# 저장소가 불변 릴리스(immutable releases)라 공개된 릴리스에는 파일을 올릴 수 없다.
# 초안(draft)에 올리고 release.yml 마지막 단계에서 공개한다
publish:
  provider: github
  owner: adamvadmin
  repo: adam-works-desktop
  releaseType: draft
